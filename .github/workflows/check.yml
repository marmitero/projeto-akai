name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: akai
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: akai_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U akai -d akai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://akai@127.0.0.1:5432/akai_test
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps
            packages
            scripts
            docs
            .github
            sprites/Character
            sprites/Enemies
            sprites/Tiles
            sprites/Assets
            sprites/Effects
            sprites/Hud
            sprites/Mine
            sprites/Materials
            sprites/Misc/Tools
            sprites/Misc/Potions
            sprites/Misc/Enchantment
            sprites/Acessories
            sprites/Equipments
            sprites/Backgrounds/Normal BG
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --test scripts/tests/mobile-network.test.mjs
      - run: npm run check
      - run: node scripts/simulate-loop.mjs
      - run: node scripts/simulate-rpg.mjs
      - run: node scripts/simulate-bestiary.mjs
      - run: node scripts/simulate-market.mjs
      - run: node scripts/simulate-monetization.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-mobile.mjs
      - run: node scripts/smoke-mobile.mjs --online
      - run: node scripts/smoke-bestiary.mjs
      - run: node scripts/smoke-bestiary.mjs --preview
      - run: npm run test:browser
      - run: node scripts/smoke-browser.mjs --preview
      - run: node scripts/smoke-online.mjs
      - run: node scripts/smoke-community.mjs
      - run: node scripts/smoke-market.mjs
      - run: node scripts/smoke-premium.mjs
      - run: VITE_GAME_MODE=online npm run build
      - run: node scripts/smoke-online.mjs --preview
      - run: node scripts/smoke-community.mjs --preview
      - run: node scripts/smoke-market.mjs --preview
      - run: node scripts/smoke-premium.mjs --preview
